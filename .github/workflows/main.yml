
name: vulnpy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a build step"
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a build step"
        continue-on-error: true

  sca:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2
        continue-on-error: true

      - run: docker run --rm -v $(pwd):/src hysnsec/safety check -r requirements.txt --json | tee sca-results.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Safety
          path: oast-results.json
        if: always()
        continue-on-error: true

  secret_scanning:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2
        continue-on-error: true

      - run: docker run --rm -v $(pwd):/src hysnsec/trufflehog filesystem ./src --fail --json > trufflehog-output.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: TruffleHog
          path: trufflehog-output.json
        if: always()
        continue-on-error: true

  sast:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2
        continue-on-error: true

      - run: docker run --rm -v $(pwd):/src hysnsec/bandit -r /src -f json -o /src/bandit-output.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Bandit
          path: bandit-output.json
        if: always()
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    needs: [sca, secret_scanning, sast]
    steps:
      - run: echo "This is an integration step"
        continue-on-error: true

      - run: exit 1
        continue-on-error: true

  zap_baseline:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - run: |
          docker pull zaproxy/zap-stable
          docker run --user root --rm -v $(pwd):/zap/wrk:rw -w /zap zaproxy/zap-stable zap-baseline.py -t http://54.163.48.153/login.php -J zap-output.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: ZAP Scan
          path: zap-output.json
        if: always()
        continue-on-error: true

  prod:
    runs-on: ubuntu-latest
    needs: zap_baseline
    steps:
      - run: echo "This is a deploy step."
        continue-on-error: true
